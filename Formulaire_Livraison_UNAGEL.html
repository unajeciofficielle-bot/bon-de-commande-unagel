<div id="app">
  <style>
    #app {
      --green: #1E7A3D;
      --green-dark: #145C2C;
      --orange: #E07A1F;
      --ink: #232323;
      --grey: #6b6b6b;
      --line: #e3e3e3;
      --bg-soft: #f7faf7;
      font-family: 'Segoe UI', Calibri, Arial, sans-serif;
      color: var(--ink);
      max-width: 980px;
      margin: 0 auto;
      padding: 4px;
    }
    #app * { box-sizing: border-box; }

    .header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 18px 20px;
      border-bottom: 3px solid var(--green);
      margin-bottom: 22px;
    }
    .header img { width: 62px; height: 62px; object-fit: contain; flex-shrink: 0; }
    .header .titles h1 {
      margin: 0;
      font-size: 20px;
      color: var(--green);
      letter-spacing: 0.5px;
    }
    .header .titles p {
      margin: 2px 0 0;
      font-size: 12.5px;
      color: var(--grey);
      line-height: 1.3;
    }
    .header .badge {
      margin-left: auto;
      text-align: right;
    }
    .header .badge div:first-child {
      font-weight: 700;
      color: var(--orange);
      font-size: 15px;
    }
    .header .badge div:last-child {
      font-size: 12px;
      color: var(--grey);
    }

    .tabs {
      display: flex;
      gap: 6px;
      margin: 0 20px 20px;
    }
    .tab-btn {
      border: 1px solid var(--line);
      background: #fff;
      padding: 9px 18px;
      border-radius: 8px 8px 0 0;
      font-size: 14px;
      font-weight: 600;
      color: var(--grey);
      cursor: pointer;
      border-bottom: none;
      transition: all 0.15s;
    }
    .tab-btn.active {
      color: var(--green);
      background: var(--bg-soft);
      box-shadow: inset 0 3px 0 var(--green);
    }

    .panel {
      background: var(--bg-soft);
      border: 1px solid var(--line);
      border-radius: 0 10px 10px 10px;
      padding: 24px;
      margin: 0 20px 20px;
    }
    .panel.hidden { display: none; }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px 18px;
    }
    .field { display: flex; flex-direction: column; gap: 5px; }
    .field.full { grid-column: 1 / -1; }
    .field label {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--green-dark);
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .field input, .field select, .field textarea {
      border: 1px solid #cfd8d1;
      border-radius: 7px;
      padding: 9px 11px;
      font-size: 14px;
      font-family: inherit;
      background: #fff;
      color: var(--ink);
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      outline: none;
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(30,122,61,0.12);
    }
    .field textarea { resize: vertical; min-height: 44px; }

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 18px;
    }
    .btn {
      border: none;
      border-radius: 7px;
      padding: 11px 22px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.15s;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: var(--green); color: #fff; }
    .btn-primary:hover { background: var(--green-dark); }
    .btn-secondary { background: #fff; color: var(--grey); border: 1px solid var(--line); }
    .btn-secondary:hover { background: #f0f0f0; }
    .btn-ghost { background: transparent; color: var(--orange); border: 1px solid var(--orange); padding: 6px 12px; font-size: 12.5px; }

    .status-msg {
      font-size: 13px;
      margin-top: 10px;
      min-height: 18px;
      font-weight: 600;
    }
    .status-msg.ok { color: var(--green-dark); }
    .status-msg.err { color: #b02a2a; }

    /* Suivi table */
    .suivi-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .suivi-toolbar .count {
      font-size: 13.5px;
      color: var(--grey);
    }
    .suivi-toolbar .count b { color: var(--green-dark); }
    .search-box input {
      border: 1px solid #cfd8d1;
      border-radius: 7px;
      padding: 8px 12px;
      font-size: 13.5px;
      width: 220px;
    }

    table.suivi {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      font-size: 13px;
      border-radius: 8px;
      overflow: hidden;
    }
    table.suivi thead th {
      background: var(--green);
      color: #fff;
      text-align: left;
      padding: 10px 9px;
      font-weight: 700;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    table.suivi tbody td {
      padding: 9px 9px;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }
    table.suivi tbody tr:nth-child(even) { background: #fafcfa; }
    table.suivi tbody tr:hover { background: #eef7ee; }
    .status-pill {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
    }
    .status-pill.en-route { background: #fff1de; color: var(--orange); }
    .status-pill.livre { background: #e2f4e6; color: var(--green-dark); }
    .del-btn {
      background: none;
      border: none;
      color: #b02a2a;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
    }
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--grey);
      font-size: 14px;
    }
    .footer-note {
      text-align: center;
      font-size: 11.5px;
      color: var(--grey);
      font-style: italic;
      margin: 6px 20px 4px;
    }
    @media (max-width: 640px) {
      .grid { grid-template-columns: 1fr; }
      .header { flex-wrap: wrap; }
      .header .badge { margin-left: 0; text-align: left; }
    }
  </style>

      const app = document.getElementById('app');
      const tabBtns = app.querySelectorAll('.tab-btn');
      const panelForm = document.getElementById('panel-form');
      const panelSuivi = document.getElementById('panel-suivi');
      const statusMsg = document.getElementById('status-msg');
      const tableWrap = document.getElementById('table-wrap');
      const countNum = document.getElementById('count-num');
      const searchInput = document.getElementById('search-input');

      let deliveries = [];
      let searchTerm = '';

      const fields = ['num','date','dest','contact','loc','qte','livreur','vehicule','statut','obs'];
      function getField(id) { return document.getElementById('f-' + id); }

      function todayISO() {
        const d = new Date();
        return d.toISOString().slice(0,10);
      }
      getField('date').value = todayISO();

      function setStatus(msg, ok) {
        statusMsg.textContent = msg;
        statusMsg.className = 'status-msg ' + (ok ? 'ok' : 'err');
        if (msg) setTimeout(() => { statusMsg.textContent = ''; }, 3500);
      }

      function nextNum() {
        const n = deliveries.length + 1;
        return 'BL-' + String(n).padStart(3, '0');
      }

      function resetForm() {
        getField('dest').value = '';
        getField('contact').value = '';
        getField('loc').value = '';
        getField('qte').value = '';
        getField('livreur').value = '';
        getField('vehicule').value = '';
        getField('obs').value = '';
        getField('statut').value = 'En route';
        getField('date').value = todayISO();
        getField('num').value = nextNum();
      }

      async function loadDeliveries() {
        try {
          const res = await window.storage.get('unagel-deliveries', true);
          deliveries = res && res.value ? JSON.parse(res.value) : [];
        } catch (e) {
          deliveries = [];
        }
        getField('num').value = nextNum();
        renderTable();
      }

      async function persist() {
        try {
          await window.storage.set('unagel-deliveries', JSON.stringify(deliveries), true);
          return true;
        } catch (e) {
          return false;
        }
      }

      function drawBonPage(doc, entry) {
        const green = [30, 122, 61];
        const orange = [224, 122, 31];
        const dark = [34, 34, 34];
        const grey = [102, 102, 102];

        try { doc.addImage(LOGO_DATA_URI, 'JPEG', 15, 12, 20, 22); } catch (e) {}

        doc.setFont('helvetica', 'bold');
        doc.setFontSize(16);
        doc.setTextColor(green[0], green[1], green[2]);
        doc.text('UNAJECI', 40, 20);

        doc.setFont('helvetica', 'normal');
        doc.setFontSize(9);
        doc.setTextColor(grey[0], grey[1], grey[2]);
        doc.text("Union Nationale des Associations de la", 40, 25);
        doc.text("Jeunesse Évangélique de Côte d'Ivoire", 40, 29.5);

        doc.setFont('helvetica', 'bold');
        doc.setFontSize(15);
        doc.setTextColor(orange[0], orange[1], orange[2]);
        doc.text('BON DE LIVRAISON', 195, 19, { align: 'right' });
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(10);
        doc.setTextColor(dark[0], dark[1], dark[2]);
        doc.text('Produit : UNAGEL', 195, 25, { align: 'right' });

        doc.setDrawColor(green[0], green[1], green[2]);
        doc.setLineWidth(0.8);
        doc.line(15, 37, 195, 37);

        let y = 47;
        doc.setFontSize(10);
        doc.setTextColor(dark[0], dark[1], dark[2]);
        doc.setFont('helvetica', 'bold'); doc.text('N° Bon :', 15, y);
        doc.setFont('helvetica', 'normal'); doc.text(String(entry.num || '-'), 33, y);
        doc.setFont('helvetica', 'bold'); doc.text('Date :', 110, y);
        doc.setFont('helvetica', 'normal'); doc.text(String(entry.date || '-'), 123, y);

        y += 8;
        doc.setFont('helvetica', 'bold'); doc.text('Livreur :', 15, y);
        doc.setFont('helvetica', 'normal'); doc.text(String(entry.livreur || '-'), 33, y);
        doc.setFont('helvetica', 'bold'); doc.text('Véhicule :', 110, y);
        doc.setFont('helvetica', 'normal'); doc.text(String(entry.vehicule || '-'), 130, y);

        y += 12;
        const headers = ['Destinataire', 'Localité', 'Contact', 'Quantité', 'Statut'];
        const colX = [17, 62, 112, 148, 168];
        doc.setFillColor(green[0], green[1], green[2]);
        doc.rect(15, y, 180, 8, 'F');
        doc.setTextColor(255, 255, 255);
        doc.setFontSize(9);
        doc.setFont('helvetica', 'bold');
        headers.forEach((h, i) => doc.text(h, colX[i], y + 5.5));
        y += 8;

        const vals = [
          String(entry.dest || '-'),
          String(entry.loc || '-'),
          String(entry.contact || '-'),
          String(entry.qte || '-'),
          String(entry.statut || '-')
        ];
        const colW = [43, 48, 34, 18, 25];
        let maxLines = 1;
        const wrapped = vals.map((v, i) => {
          const l = doc.splitTextToSize(v, colW[i] - 2);
          maxLines = Math.max(maxLines, l.length);
          return l;
        });
        const rowH = Math.max(10, maxLines * 5 + 4);
        doc.setDrawColor(200, 200, 200);
        doc.rect(15, y, 180, rowH);
        doc.setTextColor(dark[0], dark[1], dark[2]);
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(9);
        wrapped.forEach((lines, i) => doc.text(lines, colX[i], y + 6));
        y += rowH + 8;

        if (entry.obs) {
          doc.setFont('helvetica', 'bold'); doc.text('Observation :', 15, y);
          doc.setFont('helvetica', 'normal');
          const lines = doc.splitTextToSize(String(entry.obs), 155);
          doc.text(lines, 46, y);
          y += 6 * lines.length + 4;
        }

        y = Math.max(y + 20, 220);
        doc.setDrawColor(220, 220, 220);
        doc.line(15, y, 195, y);
        y += 10;
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(10);
        doc.setTextColor(dark[0], dark[1], dark[2]);
        doc.text('Le Livreur', 15, y);
        doc.text('Le Destinataire', 110, y);

        y += 10;
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(9);
        doc.setTextColor(grey[0], grey[1], grey[2]);
        doc.text('Nom : ________________________', 15, y);
        doc.text('Nom : ________________________', 110, y);
        y += 10;
        doc.text('Signature :', 15, y);
        doc.text('Signature :', 110, y);

        doc.setFontSize(8);
        doc.setTextColor(grey[0], grey[1], grey[2]);
        doc.text("UNAJECI — Cocody II Plateaux, Abidjan, Côte d'Ivoire", 105, 287, { align: 'center' });
      }

      function generatePDF(entry) {
        if (!window.jspdf) { setStatus('La bibliothèque PDF ne sait pas encore chargée, réessayez.', false); return; }
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ unit: 'mm', format: 'a4' });
        drawBonPage(doc, entry);
        doc.save('Bon_Livraison_' + (entry.num || 'UNAGEL') + '.pdf');
      }

      function generateAllPDF() {
        if (deliveries.length === 0) { setStatus('Aucune livraison à exporter.', false); return; }
        if (!window.jspdf) { setStatus('La bibliothèque PDF ne sait pas encore chargée, réessayez.', false); return; }
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ unit: 'mm', format: 'a4' });
        deliveries.forEach((entry, i) => {
          if (i > 0) doc.addPage();
          drawBonPage(doc, entry);
        });
        doc.save('Bons_Livraison_UNAGEL_' + todayISO() + '.pdf');
      }

      async function saveDelivery() {
        const dest = getField('dest').value.trim();
        const loc = getField('loc').value.trim();
        const qte = getField('qte').value.trim();
        const date = getField('date').value;

        if (!dest || !loc || !qte || !date) {
          setStatus('Merci de renseigner la date, le destinataire, la localité et la quantité.', false);
          return;
        }

        const entry = {
          id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
          num: getField('num').value || nextNum(),
          date: date,
          dest: dest,
          contact: getField('contact').value.trim(),
          loc: loc,
          qte: qte,
          livreur: getField('livreur').value.trim(),
          vehicule: getField('vehicule').value.trim(),
          statut: getField('statut').value,
          obs: getField('obs').value.trim()
        };

        deliveries.push(entry);
        const success = await persist();
        if (success) {
          const autoPdf = document.getElementById('f-autopdf').checked;
          if (autoPdf) {
            setStatus('Livraison enregistrée — génération du PDF...', true);
            generatePDF(entry);
          } else {
            setStatus('Livraison enregistrée avec succès.', true);
          }
          resetForm();
          renderTable();
        } else {
          deliveries.pop();
          setStatus("Erreur lors de l'enregistrement. Réessayez.", false);
        }
      }

      async function deleteDelivery(id) {
        deliveries = deliveries.filter(d => d.id !== id);
        await persist();
        renderTable();
      }

      function escapeHtml(str) {
        return String(str || '').replace(/[&<>"']/g, c => ({
          '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
        }[c]));
      }

      function renderTable() {
        countNum.textContent = deliveries.length;
        const filtered = deliveries.filter(d => {
          if (!searchTerm) return true;
          const hay = (d.dest + ' ' + d.loc + ' ' + d.livreur).toLowerCase();
          return hay.includes(searchTerm.toLowerCase());
        }).slice().reverse();

        if (filtered.length === 0) {
          tableWrap.innerHTML = '<div class="empty-state">Aucune livraison enregistrée pour le moment.</div>';
          return;
        }

        let html = '<table class="suivi"><thead><tr>' +
          '<th>N°</th><th>Date</th><th>Destinataire</th><th>Localité</th><th>Contact</th>' +
          '<th>Qté</th><th>Livreur</th><th>Statut</th><th>Observation</th><th></th><th></th>' +
          '</tr></thead><tbody>';

        filtered.forEach(d => {
          const pillClass = d.statut === 'Livré' ? 'livre' : 'en-route';
          html += '<tr>' +
            '<td>' + escapeHtml(d.num) + '</td>' +
            '<td>' + escapeHtml(d.date) + '</td>' +
            '<td>' + escapeHtml(d.dest) + '</td>' +
            '<td>' + escapeHtml(d.loc) + '</td>' +
            '<td>' + escapeHtml(d.contact) + '</td>' +
            '<td>' + escapeHtml(d.qte) + '</td>' +
            '<td>' + escapeHtml(d.livreur) + '</td>' +
            '<td><span class="status-pill ' + pillClass + '">' + escapeHtml(d.statut) + '</span></td>' +
            '<td>' + escapeHtml(d.obs) + '</td>' +
            '<td><button class="del-btn pdf-btn" data-id="' + d.id + '" style="color:var(--green-dark);">PDF</button></td>' +
            '<td><button class="del-btn" data-id="' + d.id + '">Suppr.</button></td>' +
            '</tr>';
        });
        html += '</tbody></table>';
        tableWrap.innerHTML = html;

        tableWrap.querySelectorAll('.pdf-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const entry = deliveries.find(d => d.id === btn.getAttribute('data-id'));
            if (entry) generatePDF(entry);
          });
        });
        tableWrap.querySelectorAll('.del-btn:not(.pdf-btn)').forEach(btn => {
          btn.addEventListener('click', () => deleteDelivery(btn.getAttribute('data-id')));
        });
      }

      function exportCSV() {
        if (deliveries.length === 0) { setStatus('Aucune donnée à exporter.', false); return; }
        const headers = ['N°','Date','Destinataire','Localité','Contact','Quantité','Livreur','Véhicule','Statut','Observation'];
        const rows = deliveries.map(d => [d.num,d.date,d.dest,d.loc,d.contact,d.qte,d.livreur,d.vehicule,d.statut,d.obs]);
        let csv = headers.join(';') + '\n';
        rows.forEach(r => {
          csv += r.map(v => '"' + String(v || '').replace(/"/g,'""') + '"').join(';') + '\n';
        });
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'suivi_livraisons_unagel.csv';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }

      tabBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          tabBtns.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          if (btn.dataset.tab === 'form') {
            panelForm.classList.remove('hidden');
            panelSuivi.classList.add('hidden');
          } else {
            panelForm.classList.add('hidden');
            panelSuivi.classList.remove('hidden');
            renderTable();
          }
        });
      });

      document.getElementById('btn-save').addEventListener('click', saveDelivery);
      document.getElementById('btn-reset').addEventListener('click', resetForm);
      document.getElementById('btn-export').addEventListener('click', exportCSV);
      document.getElementById('btn-export-all-pdf').addEventListener('click', generateAllPDF);
      searchInput.addEventListener('input', (e) => {
        searchTerm = e.target.value;
        renderTable();
      });

      loadDeliveries();
    })();
  </script>
</div>
